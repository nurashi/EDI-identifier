<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EDI-identifier viewer</title>
<style>
:root { --bg:#f6f7f9; --panel:#fff; --line:#dde1e6; --text:#1d2329; --muted:#66707a; --diff:#c0392b; --review:#b9770e; --one:#5d6d7e; --same:#1e8449; --accent:#1f5fae; }
* { box-sizing: border-box; }
body { margin:0; font:14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--text); background:var(--bg); }
header { display:flex; gap:16px; align-items:center; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
header h1 { font-size:16px; margin:0 12px 0 0; }
select { font:inherit; padding:4px 6px; }
.chips { display:flex; gap:6px; flex-wrap:wrap; }
.chip { border:1px solid var(--line); border-radius:12px; padding:2px 10px; cursor:pointer; user-select:none; background:#fff; }
.chip.off { opacity:.4; }
.layout { display:grid; grid-template-columns: 400px 1fr; gap:12px; padding:12px; height:calc(100vh - 58px); }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:auto; }
.list .row { display:grid; grid-template-columns: 80px 78px 1fr; gap:6px; padding:7px 10px; border-bottom:1px solid var(--line); cursor:pointer; font-size:13px; }
.list .row:hover { background:#f0f4fa; }
.list .row.sel { background:#e3edf9; }
.badge { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.02em; }
.v-different { color:var(--diff); } .v-review { color:var(--review); } .v-one_side { color:var(--one); } .v-same { color:var(--same); }
.key { font-family: ui-monospace, Menlo, monospace; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.detail { padding:14px 16px; }
.detail h2 { font-size:15px; margin:0 0 4px; font-family: ui-monospace, Menlo, monospace; }
.detail .sub { color:var(--muted); margin-bottom:12px; }
.sides { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.side { border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
.side h3 { margin:0 0 6px; font-size:13px; color:var(--muted); font-weight:600; }
.value { font-size:14px; margin-bottom:10px; }
.src { background:#fafbfc; border:1px solid var(--line); border-radius:6px; padding:8px 10px; margin-top:8px; }
.src .pg { font-size:12px; color:var(--muted); display:flex; justify-content:space-between; }
.src mark { background:#fff3c4; padding:0 2px; }
.src ul { margin:6px 0 0; padding-left:16px; font-family: ui-monospace, Menlo, monospace; font-size:12px; }
.why { margin:12px 0 0; padding:8px 10px; border-left:3px solid var(--accent); background:#f2f6fb; }
a { color:var(--accent); }
.only { padding:8px 10px; font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>EDI-identifier · comparison viewer <span style="color:var(--muted);font-weight:400">prototype</span></h1>
  <label>Guides <select id="pair"></select></label>
  <div class="chips" id="cats"></div>
  <div class="chips" id="verdicts"></div>
</header>
<div class="layout">
  <div class="panel list" id="list"></div>
  <div class="panel detail" id="detail"></div>
</div>
<script>
const DATA = /*DATA*/null;
const CATS = ["usage", "codes", "repetition", "condition"];
const VERDICTS = ["different", "review", "one_side", "same"];
const state = { pair: 0, cats: new Set(CATS), verdicts: new Set(["different", "review"]), sel: null };
const el = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const label = v => v.replace("_", " ");

DATA.reports.forEach((r, i) => {
  const o = document.createElement("option");
  o.value = i; o.textContent = `${DATA.guides[r.left].partner} ~ ${DATA.guides[r.right].partner}`;
  el("pair").append(o);
});
el("pair").onchange = e => { state.pair = +e.target.value; state.sel = null; render(); };

function chips(id, values, set) {
  el(id).innerHTML = "";
  for (const v of values) {
    const c = document.createElement("span");
    c.className = "chip" + (set.has(v) ? "" : " off") + (id === "verdicts" ? " v-" + v : "");
    c.textContent = label(v);
    c.onclick = () => { set.has(v) ? set.delete(v) : set.add(v); state.sel = null; render(); };
    el(id).append(c);
  }
}

function source(guideId, key, pages) {
  const g = DATA.guides[guideId];
  const ev = (g.evidence[key] || []).filter(e => pages.includes(e.page));
  return pages.map(p => {
    const items = ev.filter(e => e.page === p).flatMap(e => e.excerpt.split(" / ")).slice(0, 6);
    return `<div class="src"><div class="pg"><span>${esc(g.partner)} · page ${p}</span><a href="${esc(g.url)}#page=${p}" target="_blank">open page ${p}</a></div>
      <ul>${items.map(x => `<li><mark>${esc(x)}</mark></li>`).join("")}</ul></div>`;
  }).join("");
}

function render() {
  const r = DATA.reports[state.pair];
  chips("cats", CATS, state.cats);
  chips("verdicts", VERDICTS, state.verdicts);
  const rows = r.findings.filter(f => state.cats.has(f.category) && state.verdicts.has(f.verdict));
  if (state.sel === null || !rows.includes(state.sel)) state.sel = rows[0] || null;
  el("list").innerHTML = "";
  for (const f of rows) {
    const d = document.createElement("div");
    d.className = "row" + (f === state.sel ? " sel" : "");
    d.innerHTML = `<span class="badge v-${f.verdict}">${label(f.verdict)}</span><span>${f.category}</span><span class="key" title="${esc(f.left_key)}">${esc(f.left_key.split(":").pop())}</span>`;
    d.onclick = () => { state.sel = f; render(); };
    el("list").append(d);
  }
  const only = [...r.left_only.map(a => [r.left, a]), ...r.right_only.map(a => [r.right, a])];
  el("list").insertAdjacentHTML("beforeend", `<div class="only">${rows.length} findings shown · ${only.length} requirements defined in one guide only</div>`);
  const f = state.sel;
  if (!f) { el("detail").innerHTML = "<p>No findings for these filters.</p>"; return; }
  const L = DATA.guides[r.left], R = DATA.guides[r.right];
  el("detail").innerHTML = `
    <h2>${esc(f.left_key)}${f.right_key !== f.left_key ? " = " + esc(f.right_key) : ""}</h2>
    <div class="sub"><span class="badge v-${f.verdict}">${label(f.verdict)}</span> · ${f.category} · aligned by ${f.alignment}</div>
    ${f.detail ? `<div class="why">${esc(f.detail)}</div>` : ""}
    <div class="sides" style="margin-top:12px">
      <div class="side"><h3>${esc(L.partner)} · ${esc(L.revision)}</h3><div class="value">${esc(f.left)}</div>${source(r.left, f.left_key, f.left_pages)}</div>
      <div class="side"><h3>${esc(R.partner)} · ${esc(R.revision)}</h3><div class="value">${esc(f.right)}</div>${source(r.right, f.right_key, f.right_pages)}</div>
    </div>`;
}

state.pair = Math.max(0, DATA.reports.findIndex(r => r.left === "chr-214" && r.right === "kbx-214"));
el("pair").value = state.pair;
render();
const start = DATA.reports[state.pair].findings.find(f => f.left_key.endsWith("AT7@140/AT701") && f.category === "codes");
if (start) { state.sel = start; render(); }
</script>
</body>
</html>
