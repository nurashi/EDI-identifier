<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EDI-identifier viewer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root { --ink:#10242b; --bg:#eef2f0; --panel:#fcfdfb; --line:#d5ddd9; --text:#33454c; --muted:#62737a; --a:#0b7a75; --a-soft:#dcefec; --b:#c2462b; --b-soft:#fbe7e1; --amber:#7a4e06; --amber-soft:#f6e7c9; --grey-soft:#e3e7e5; --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace; }
* { box-sizing: border-box; }
body { margin:0; font:15px/1.45 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--text); background:var(--bg); }
header { display:flex; gap:20px; align-items:center; padding:12px 20px; background:var(--ink); color:#eef3f1; flex-wrap:wrap; }
header h1 { font-size:17px; font-weight:600; margin:0 8px 0 0; }
header h1 span { color:#a7bab8; font-weight:400; }
header label { color:#a7bab8; font-size:14px; }
select { font:inherit; color:var(--ink); padding:5px 8px; border-radius:6px; border:0; margin-left:6px; }
.chips { display:flex; gap:6px; flex-wrap:wrap; }
.chip { border:1px solid #3a5560; color:#eef3f1; border-radius:999px; padding:3px 12px; cursor:pointer; user-select:none; font-size:13px; }
.chip.off { opacity:.35; }
.layout { display:grid; grid-template-columns: 430px 1fr; gap:14px; padding:14px; height:calc(100vh - 60px); }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:auto; }
.list .row { display:grid; grid-template-columns: 92px 84px 1fr; gap:8px; align-items:center; padding:8px 12px; border-bottom:1px solid var(--line); border-left:4px solid transparent; cursor:pointer; font-size:14px; }
.list .row:hover { background:#f1f5f3; }
.list .row.sel { background:var(--a-soft); border-left-color:var(--a); }
.pill { display:inline-block; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.03em; padding:2px 8px; border-radius:999px; text-align:center; }
.v-different { background:var(--b-soft); color:#a3361d; }
.v-review { background:var(--amber-soft); color:var(--amber); }
.v-one_side { background:var(--grey-soft); color:#4a5a60; }
.v-same { background:var(--a-soft); color:#0b5c58; }
.key { font-family:var(--mono); font-size:13px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.detail { padding:18px 20px; }
.detail h2 { font-family:var(--mono); font-size:20px; font-weight:500; color:var(--ink); margin:0 0 8px; }
.meta { display:flex; gap:10px; align-items:center; color:var(--muted); font-size:14px; }
.why { margin:14px 0 0; padding:10px 14px; border-left:4px solid var(--b); background:var(--b-soft); color:var(--ink); border-radius:0 8px 8px 0; font-size:15px; }
.sides { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px; }
.side { border:1px solid var(--line); border-top:4px solid var(--a); border-radius:10px; padding:12px 14px; background:#fff; }
.side.b { border-top-color:var(--b); }
.side .who { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
.side h3 { margin:0; font-size:16px; color:var(--ink); font-weight:600; }
.tag { font-size:12px; font-weight:600; color:var(--a); }
.side.b .tag { color:var(--b); }
.rev { font-size:12px; color:var(--muted); margin:2px 0 10px; }
.value { font-size:18px; font-weight:500; color:var(--ink); margin-bottom:10px; }
.src { background:#f6f8f7; border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-top:8px; }
.src .pg { font-size:13px; color:var(--muted); display:flex; justify-content:space-between; align-items:center; }
.src a { font-size:12px; font-weight:600; color:var(--a); text-decoration:none; border:1px solid var(--a); border-radius:999px; padding:1px 10px; }
.side.b .src a { color:var(--b); border-color:var(--b); }
.src ul { margin:6px 0 0; padding-left:16px; font-family:var(--mono); font-size:12.5px; color:var(--ink); }
.src mark { background:#fff1c2; padding:0 2px; }
.only { padding:10px 12px; font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>EDI-identifier <span>· comparison viewer</span></h1>
  <label>Guides<select id="pair"></select></label>
  <div class="chips" id="cats"></div>
  <div class="chips" id="verdicts"></div>
</header>
<div class="layout">
  <div class="panel list" id="list"></div>
  <div class="panel detail" id="detail"></div>
</div>
<script>
const DATA = /*DATA*/null;
const CATS = ["usage", "codes", "repetition", "condition"];
const VERDICTS = ["different", "review", "one_side", "same"];
const state = { pair: 0, cats: new Set(CATS), verdicts: new Set(["different", "review"]), sel: null };
const el = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const label = v => v.replace("_", " ");

DATA.reports.forEach((r, i) => {
  const o = document.createElement("option");
  o.value = i; o.textContent = `${DATA.guides[r.left].partner} ~ ${DATA.guides[r.right].partner}`;
  el("pair").append(o);
});
el("pair").onchange = e => { state.pair = +e.target.value; state.sel = null; render(); };

function chips(id, values, set) {
  el(id).innerHTML = "";
  for (const v of values) {
    const c = document.createElement("span");
    c.className = "chip" + (set.has(v) ? "" : " off");
    c.textContent = label(v);
    c.onclick = () => { set.has(v) ? set.delete(v) : set.add(v); state.sel = null; render(); };
    el(id).append(c);
  }
}

function source(guideId, key, pages) {
  const g = DATA.guides[guideId];
  const ev = (g.evidence[key] || []).filter(e => pages.includes(e.page));
  return pages.map(p => {
    const items = ev.filter(e => e.page === p).flatMap(e => e.excerpt.split(" / ")).slice(0, 6);
    return `<div class="src"><div class="pg"><span>Page ${p}</span><a href="${esc(g.url)}#page=${p}" target="_blank">Open page ${p} ↗</a></div>
      <ul>${items.map(x => `<li><mark>${esc(x)}</mark></li>`).join("")}</ul></div>`;
  }).join("");
}

function side(cls, tag, g, value, guideId, key, pages) {
  return `<div class="side ${cls}"><div class="who"><h3>${esc(g.partner)}</h3><span class="tag">${tag}</span></div>
    <div class="rev">${esc(g.revision)}</div><div class="value">${esc(value)}</div>${source(guideId, key, pages)}</div>`;
}

function render() {
  const r = DATA.reports[state.pair];
  chips("cats", CATS, state.cats);
  chips("verdicts", VERDICTS, state.verdicts);
  const rows = r.findings.filter(f => state.cats.has(f.category) && state.verdicts.has(f.verdict));
  if (state.sel === null || !rows.includes(state.sel)) state.sel = rows[0] || null;
  el("list").innerHTML = "";
  for (const f of rows) {
    const d = document.createElement("div");
    d.className = "row" + (f === state.sel ? " sel" : "");
    d.innerHTML = `<span class="pill v-${f.verdict}">${label(f.verdict)}</span><span>${f.category}</span><span class="key" title="${esc(f.left_key)}">${esc(f.left_key.split(":").pop())}</span>`;
    d.onclick = () => { state.sel = f; render(); };
    el("list").append(d);
  }
  const only = [...r.left_only.map(a => [r.left, a]), ...r.right_only.map(a => [r.right, a])];
  el("list").insertAdjacentHTML("beforeend", `<div class="only">${rows.length} findings shown · ${only.length} requirements defined in one guide only</div>`);
  const f = state.sel;
  if (!f) { el("detail").innerHTML = "<p>No findings for these filters.</p>"; return; }
  const L = DATA.guides[r.left], R = DATA.guides[r.right];
  el("detail").innerHTML = `
    <h2>${esc(f.left_key)}${f.right_key !== f.left_key ? " = " + esc(f.right_key) : ""}</h2>
    <div class="meta"><span class="pill v-${f.verdict}">${label(f.verdict)}</span><span>${f.category}</span><span>aligned by ${f.alignment}</span></div>
    ${f.detail ? `<div class="why">${esc(f.detail)}</div>` : ""}
    <div class="sides">
      ${side("a", "Partner A", L, f.left, r.left, f.left_key, f.left_pages)}
      ${side("b", "Partner B", R, f.right, r.right, f.right_key, f.right_pages)}
    </div>`;
}

state.pair = Math.max(0, DATA.reports.findIndex(r => r.left === "chr-214" && r.right === "kbx-214"));
el("pair").value = state.pair;
render();
const start = DATA.reports[state.pair].findings.find(f => f.left_key.endsWith("AT7@140/AT701") && f.category === "codes");
if (start) { state.sel = start; render(); }
</script>
</body>
</html>
