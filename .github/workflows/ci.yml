name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - run: docker build -t edi-backend .

  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pipx run check-jsonschema --check-metaschema schema/guide.schema.json schema/divergence.schema.json
      - run: pipx run check-jsonschema --schemafile schema/guide.schema.json schema/examples/*.json
