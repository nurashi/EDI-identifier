services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: edi
      POSTGRES_USER: edi
      POSTGRES_PASSWORD: edi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edi -d edi"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
